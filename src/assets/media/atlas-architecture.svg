<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 960 420" width="960" height="420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Atlas serving architecture</title>
  <desc id="d">Client sends POST /chat to a FastAPI gateway, which pushes the tokenized request onto a Redis list. Inference workers pop requests, form micro-batches of up to 8 within 25 ms, decode, and publish tokens to a per-request Redis pub/sub channel; the gateway streams them back to the client as server-sent events and logs each request to Postgres. A Kubernetes HPA scales workers from 1 to 6 replicas; Prometheus scrapes the gateway's /metrics and Grafana visualizes them.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect y="50" width="960" height="420" fill="#ffffff"/>

  <!-- k8s namespace boundary -->
  <rect x="190" y="62" width="750" height="288" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="206" y="88" font-size="12" fill="#64748b" letter-spacing="0.4">KUBERNETES NAMESPACE tinygpt (Minikube) · also runs via Docker Compose or locally</text>

  <!-- Client -->
  <rect x="20" y="140" width="140" height="78" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="90" y="172" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Client</text>
  <text x="90" y="192" font-size="12" fill="#475569" text-anchor="middle">browser UI or</text>
  <text x="90" y="207" font-size="12" fill="#475569" text-anchor="middle">load_test.py</text>

  <!-- API -->
  <rect x="230" y="120" width="200" height="118" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="330" y="148" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">FastAPI gateway</text>
  <text x="330" y="170" font-size="12" fill="#475569" text-anchor="middle">POST /chat → tokenize</text>
  <text x="330" y="187" font-size="12" fill="#475569" text-anchor="middle">streams tokens as SSE</text>
  <text x="330" y="204" font-size="12" fill="#475569" text-anchor="middle">GET /info · GET /metrics</text>
  <text x="330" y="226" font-size="11" fill="#64748b" text-anchor="middle">1 replica · async</text>

  <!-- Redis -->
  <rect x="500" y="120" width="170" height="118" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="585" y="148" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Redis</text>
  <text x="585" y="170" font-size="12" fill="#475569" text-anchor="middle">request queue (list)</text>
  <text x="585" y="187" font-size="12" fill="#475569" text-anchor="middle">per-request pub/sub</text>
  <text x="585" y="204" font-size="12" fill="#475569" text-anchor="middle">token channels</text>
  <text x="585" y="226" font-size="11" fill="#64748b" text-anchor="middle">+ worker stats hash</text>

  <!-- Workers (stacked) -->
  <rect x="752" y="104" width="170" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="746" y="112" width="170" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="740" y="120" width="170" height="118" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="825" y="148" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Inference workers</text>
  <text x="825" y="170" font-size="12" fill="#475569" text-anchor="middle">micro-batch ≤ 8 req</text>
  <text x="825" y="187" font-size="12" fill="#475569" text-anchor="middle">or 25 ms window</text>
  <text x="825" y="204" font-size="12" fill="#475569" text-anchor="middle">21.5M-param decoder</text>
  <text x="825" y="226" font-size="11" fill="#64748b" text-anchor="middle">CPU in k8s · CUDA/MPS locally</text>

  <!-- HPA -->
  <rect x="740" y="268" width="170" height="58" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="825" y="292" font-size="13" font-weight="600" fill="#0f766e" text-anchor="middle">HPA: 1 → 6 replicas</text>
  <text x="825" y="311" font-size="11.5" fill="#475569" text-anchor="middle">CPU 70% · memory 80%</text>
  <line x1="825" y1="268" x2="825" y2="242" stroke="#0f766e" stroke-width="1.4" marker-end="url(#at)"/>

  <!-- Postgres -->
  <rect x="230" y="268" width="200" height="58" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="330" y="292" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">PostgreSQL (StatefulSet)</text>
  <text x="330" y="311" font-size="11.5" fill="#475569" text-anchor="middle">request_logs: status, latency, tokens</text>
  <line x1="330" y1="238" x2="330" y2="264" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- Prom / Grafana -->
  <rect x="480" y="268" width="210" height="58" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="585" y="292" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Prometheus → Grafana</text>
  <text x="585" y="311" font-size="11.5" fill="#475569" text-anchor="middle">optional; scrapes /metrics every 10 s</text>
  <path d="M480,297 C455,297 440,240 420,240" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- request path -->
  <line x1="160" y1="168" x2="226" y2="168" stroke="#0f766e" stroke-width="1.8" marker-end="url(#at)"/>
  <line x1="430" y1="160" x2="496" y2="160" stroke="#0f766e" stroke-width="1.8" marker-end="url(#at)"/>
  <text x="463" y="152" font-size="11" fill="#0f766e" text-anchor="middle">RPUSH</text>
  <line x1="670" y1="160" x2="736" y2="160" stroke="#0f766e" stroke-width="1.8" marker-end="url(#at)"/>
  <text x="703" y="152" font-size="11" fill="#0f766e" text-anchor="middle">BLPOP</text>

  <!-- token return path -->
  <line x1="740" y1="200" x2="674" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="707" y="216" font-size="11" fill="#475569" text-anchor="middle">PUBLISH</text>
  <line x1="500" y1="200" x2="434" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="467" y="216" font-size="11" fill="#475569" text-anchor="middle">SUBSCRIBE</text>
  <line x1="230" y1="200" x2="164" y2="200" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="196" y="216" font-size="11" fill="#475569" text-anchor="middle">SSE</text>

  <!-- footer: measured numbers from repo -->
  <text x="20" y="388" font-size="12.5" font-weight="600" fill="#0f172a">Committed load tests (10 users × 10 requests, scripts/load_test.py):</text>
  <text x="20" y="410" font-size="12.5" fill="#334155">local stack: 21.7 req/s, p95 1,026 ms, avg batch 7.1   ·   Minikube: 11.7 req/s, p95 1,465 ms, avg batch 6.3</text>
  <text x="20" y="432" font-size="11.5" fill="#64748b">Responses are short (≈4 tokens each); hardware for these runs is not recorded in the repo. CI gate fails a PR if p95 &gt; 2.5 s or throughput &lt; 6 req/s.</text>
  <text x="20" y="452" font-size="11.5" fill="#64748b">Teal arrows: request path. Gray arrows: token stream back to the client.</text>
</svg>
