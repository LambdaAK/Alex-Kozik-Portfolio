<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect fill="#ffffff"/>
  <g font-size="13" fill="#0f172a">
    <!-- front end -->
    <rect x="20" y="150" width="110" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="75" y="176" text-anchor="middle" font-weight="600">.forge</text>
    <text x="75" y="194" text-anchor="middle" fill="#64748b" font-size="11">+ prelude</text>

    <rect x="160" y="150" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="225" y="176" text-anchor="middle" font-weight="600">lex · parse</text>
    <text x="225" y="194" text-anchor="middle" fill="#64748b" font-size="11">macro_rules!, modules</text>

    <rect x="320" y="150" width="170" height="60" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text x="405" y="174" text-anchor="middle" font-weight="600">Hindley-Milner inference</text>
    <text x="405" y="193" text-anchor="middle" fill="#0f766e" font-size="11">traits → dictionary passing</text>

    <line x1="130" y1="180" x2="158" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <line x1="290" y1="180" x2="318" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- branch: native -->
    <path d="M490 170 C520 170 520 70 548 70" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="550" y="40" width="90" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="595" y="66" text-anchor="middle" font-weight="600">Min IR</text>
    <text x="595" y="84" text-anchor="middle" fill="#64748b" font-size="11">.mir</text>
    <line x1="640" y1="70" x2="668" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="670" y="40" width="90" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="715" y="66" text-anchor="middle" font-weight="600">LLVM IR</text>
    <text x="715" y="84" text-anchor="middle" fill="#64748b" font-size="11">.ll</text>
    <line x1="760" y1="70" x2="788" y2="70" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="790" y="40" width="150" height="60" rx="8" fill="#0f766e"/>
    <text x="865" y="66" text-anchor="middle" font-weight="600" fill="#ffffff">native binary</text>
    <text x="865" y="84" text-anchor="middle" fill="#ccfbf1" font-size="11">clang -O1 + C runtime</text>

    <!-- branch: interpreter -->
    <line x1="490" y1="180" x2="788" y2="180" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="790" y="150" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="865" y="176" text-anchor="middle" font-weight="600">tree-walking</text>
    <text x="865" y="194" text-anchor="middle" fill="#64748b" font-size="11">interpreter + REPL</text>

    <!-- branch: browser -->
    <path d="M490 190 C520 190 520 290 548 290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="550" y="260" width="210" height="60" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="655" y="286" text-anchor="middle" font-weight="600">js_of_ocaml</text>
    <text x="655" y="304" text-anchor="middle" fill="#64748b" font-size="11">same OCaml front end + interpreter</text>
    <line x1="760" y1="290" x2="788" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="790" y="260" width="150" height="60" rx="8" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="865" y="286" text-anchor="middle" font-weight="600">browser</text>
    <text x="865" y="304" text-anchor="middle" fill="#0369a1" font-size="11">forge.js, 88 KB gzip</text>

    <text x="20" y="365" fill="#64748b" font-size="12">OCaml, ~22k lines in src/. Test suite: 2,777 tests (2,776 pass), incl. 544 compile-and-run cases (543 pass).</text>
  </g>
</svg>
